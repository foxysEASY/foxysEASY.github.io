<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>С 8 Марта, кисочка <3</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    max-width:450px;
}

h1{
    color:#ff4d6d;
}

p{
    font-size:18px;
    color:#444;
}

.photo{
    width:100%;
    border-radius:15px;
    margin:15px 0;
    box-shadow:0 5px 20px rgba(0,0,0,0.25);
    transition:0.4s;
}

.photo:hover{
    transform:scale(1.05);
}

button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:25px;
    background:#ff4d6d;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.heart{
    position:absolute;
    color:#ff4d6d;
    animation:float 6s linear infinite;
}

@keyframes float{
    0%{transform:translateY(0);opacity:1;}
    100%{transform:translateY(-100vh);opacity:0;}
}

</style>
</head>

<body>

<div class="card">

<h1>С 8 Марта кисофка <333</h1>

<img src="photo.jpg" class="photo">

<p>
Любимая кисофка, поздравляю тебя с 8 марта!  
Ты самое прекрасное, что есть в моей жизни.  
Спасибо за твою любовь, моя девочка!
</p>

<button onclick="love()">Нажми ❤️</button>

</div>

<script>

function love(){
    alert("Этот сайт-открыточку я написал для тебя сам. Ты просила меня сделать что-то для тебя своими ручками...");
}

function heart(){
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤";
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(20+Math.random()*30)+"px";
    document.body.appendChild(h);

    setTimeout(()=>{h.remove()},6000);
}

setInterval(heart,400);

</script>

</body>
</html>
